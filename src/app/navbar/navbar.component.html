<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <div class="nav-content">
      <a class="logo" routerLink="/" (click)="closeMobileMenu()">
        <span class="logo-mark">G</span>
        <span class="logo-text">GlossFit</span>
      </a>

      <div class="nav-right" *ngIf="!isCreateProfilePage">
        <div class="nav-menu">
          <ng-container *ngIf="isLoggedIn; else landingMenu">
            <a class="nav-link" routerLink="/feed" routerLinkActive="active">Feed</a>
            <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
            <a class="nav-link" routerLink="/dressing" routerLinkActive="active">Dressing</a>
            <a class="nav-link" routerLink="/styling" routerLinkActive="active">Styling</a>
            <a class="nav-link" [routerLink]="isAdmin ? '/adminDashbord' : '/home'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
            <a class="nav-link" *ngIf="isFashionista" routerLink="/dressing" routerLinkActive="active">Dressing</a>
          </ng-container>
          <ng-template #landingMenu>
            <button class="nav-link" [class.active]="activeSection === 'features'" type="button" (click)="goToSection('features')">Fonctionnalites</button>
            <button class="nav-link" [class.active]="activeSection === 'about'" type="button" (click)="goToSection('about')">A propos</button>
            <button class="nav-link" [class.active]="activeSection === 'pricing'" type="button" (click)="goToSection('pricing')">Tarifs</button>
            <button class="nav-link" [class.active]="activeSection === 'contact'" type="button" (click)="goToSection('contact')">Contact</button>
          </ng-template>
        </div>

        <div class="nav-actions">
          <button
            class="icon-btn lang-btn"
            type="button"
            (click)="toggleLanguage()"
            [attr.aria-label]="language === 'fr' ? 'Switch to English' : 'Passer en francais'"
            [attr.title]="language === 'fr' ? 'Switch to English' : 'Passer en francais'"
          >
            <i class="fa-solid fa-language lang-icon"></i>
            <span class="lang-code">{{ language === 'fr' ? 'FR' : 'EN' }}</span>
          </button>

          <ng-container *ngIf="!isLoggedIn; else loggedInMenu">
            <a class="btn btn-text" routerLink="/signin">Login</a>
            <a class="btn btn-primary" routerLink="/signup">Creer un compte</a>
          </ng-container>
          <ng-template #loggedInMenu>
            <button class="icon-btn" type="button" aria-label="Notifications" title="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="notification-badge">3</span>
            </button>

            <div class="profile-menu-wrapper">
              <button class="user-avatar-btn" type="button" (click)="toggleProfileMenu()">
                <span class="user-avatar">{{ user.avatar }}</span>
                <span class="user-name">{{ user.name }}</span>
                <svg class="chevron" [class.open]="isProfileMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </button>

              <div class="dropdown-menu" [class.open]="isProfileMenuOpen">
                <div class="dropdown-header">
                  <span class="dropdown-name">{{ user.name }}</span>
                  <span class="dropdown-role">{{ displayRole }}</span>
                </div>
                <a class="dropdown-item" [routerLink]="profileRoute" (click)="closeMobileMenu()">Mon profil</a>
                <a class="dropdown-item" [routerLink]="settingsRoute" (click)="closeMobileMenu()">Parametres</a>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item logout" type="button" (click)="logout()">Deconnexion</button>
              </div>
            </div>
          </ng-template>
        </div>

        <button class="mobile-menu-btn" type="button" aria-label="Menu" (click)="toggleMobileMenu()">
          <span class="hamburger" [class.open]="isMobileMenuOpen"></span>
        </button>
      </div>
    </div>

    <div class="mobile-menu" [class.open]="isMobileMenuOpen" *ngIf="!isCreateProfilePage">
      <button class="mobile-language" type="button" (click)="toggleLanguage()">
        <i class="fa-solid fa-language lang-icon"></i>
        <span>{{ language === 'fr' ? 'Francais' : 'English' }}</span>
      </button>

      <ng-container *ngIf="isLoggedIn; else mobileLandingMenu">
      </ng-container>
      <ng-template #mobileLandingMenu>
        <button class="mobile-link" type="button" (click)="goToSection('features')">Fonctionnalites</button>
        <button class="mobile-link" type="button" (click)="goToSection('about')">A propos</button>
        <button class="mobile-link" type="button" (click)="goToSection('pricing')">Tarifs</button>
        <button class="mobile-link" type="button" (click)="goToSection('contact')">Contact</button>
      </ng-template>

      <ng-container *ngIf="!isLoggedIn; else mobileLoggedInMenu">
        <a class="btn btn-text mobile-btn" routerLink="/signin" (click)="closeMobileMenu()">Login</a>
        <a class="btn btn-primary mobile-btn" routerLink="/signup" (click)="closeMobileMenu()">Creer un compte</a>
      </ng-container>
      <ng-template #mobileLoggedInMenu>
        <div class="mobile-user-info">
          <span class="user-avatar">{{ user.avatar }}</span>
          <div>
            <span class="mobile-user-name">{{ user.name }}</span>
            <span class="mobile-user-role">{{ displayRole }}</span>
          </div>
        </div>
        <a class="mobile-link" routerLink="/feed" (click)="closeMobileMenu()">Feed</a>
        <a class="mobile-link" routerLink="/home" (click)="closeMobileMenu()">Dashboard</a>
        <a class="mobile-link" routerLink="/dressing" (click)="closeMobileMenu()">Dressing</a>
        <a class="mobile-link" routerLink="/styling" (click)="closeMobileMenu()">Styling</a>
        <a class="mobile-link" [routerLink]="isAdmin ? '/adminDashbord' : '/home'" (click)="closeMobileMenu()">Dashboard</a>
        <a class="mobile-link" *ngIf="isFashionista" routerLink="/dressing" (click)="closeMobileMenu()">Dressing</a>
        <a class="mobile-link" [routerLink]="profileRoute" (click)="closeMobileMenu()">Mon profil</a>
        <a class="mobile-link" [routerLink]="settingsRoute" (click)="closeMobileMenu()">Parametres</a>
        <button class="btn btn-logout-mobile" type="button" (click)="logout()">Deconnexion</button>
      </ng-template>
    </div>
  </div>
</nav>
