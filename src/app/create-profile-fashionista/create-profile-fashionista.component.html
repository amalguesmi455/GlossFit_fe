<div class="profile-page">
  <div class="container">
    <div class="header">
      <h1 class="page-title"></h1>
    </div>

    <form (ngSubmit)="submit()" class="profile-form">
      <h1 class="page-title">Créer votre profil Fashionista</h1>
      <p class="page-subtitle">
        Complétez votre profil pour trouver le styliste parfait
      </p>

      <!-- Step indicator -->
      <div class="steps">
        <span class="step" [class.active]="currentStep === 1" [class.done]="currentStep > 1">
          <i class="fa-solid fa-user"></i> Identité
        </span>
        <span class="step-sep"><i class="fa-solid fa-chevron-right"></i></span>
        <span class="step" [class.active]="currentStep === 2" [class.done]="currentStep > 2">
          <i class="fa-solid fa-body"></i> Morphologie
        </span>
        <span class="step-sep"><i class="fa-solid fa-chevron-right"></i></span>
        <span class="step" [class.active]="currentStep === 3">
          <i class="fa-solid fa-sparkles"></i> Style
        </span>
      </div>

      <!-- Error Alert -->
      <div class="alert-error" *ngIf="message && message.includes('Erreur')">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ message }}
      </div>

      <!-- Success Alert -->
      <div class="alert-success" *ngIf="message && !message.includes('Erreur')">
        <i class="fa-solid fa-circle-check"></i>
        {{ message }}
      </div>

      <!-- Step 1: Identity -->
      <div class="form-step" *ngIf="currentStep === 1">
        <div class="form-group">
          <label for="nom" class="form-label">Nom <em>*</em></label>
          <input
            id="nom"
            type="text"
            [(ngModel)]="formData.nom"
            name="nom"
            class="form-input"
            placeholder="Dupont"
          />
        </div>

        <div class="form-group">
          <label for="prenom" class="form-label">Prénom <em>*</em></label>
          <input
            id="prenom"
            type="text"
            [(ngModel)]="formData.prenom"
            name="prenom"
            class="form-input"
            placeholder="Marie"
          />
        </div>

        <div class="form-group">
          <label for="ville" class="form-label">Ville</label>
          <input
            id="ville"
            type="text"
            [(ngModel)]="formData.ville"
            name="ville"
            class="form-input"
            placeholder="Paris"
          />
        </div>

        <div class="form-group">
          <label for="profilePicture" class="form-label">Photo de profil</label>
          <div class="avatar-upload" (click)="fileInput.click()">
            <div class="avatar-preview" *ngIf="avatarPreview">
              <img [src]="avatarPreview" alt="Aperçu">
            </div>
            <div class="avatar-placeholder" *ngIf="!avatarPreview">
              <i class="fa-solid fa-camera"></i>
              <span>Ajouter une photo</span>
            </div>
          </div>
          <input #fileInput id="profilePicture" name="profilePicture" type="file"
            accept="image/*" (change)="onFileSelected($event)" hidden>
        </div>

        <button class="btn-submit" type="button" (click)="nextStep()" [disabled]="!formData.nom || !formData.prenom">
          Continuer <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Step 2: Morphology -->
      <div class="form-step" *ngIf="currentStep === 2">
        <div class="form-group">
          <label class="form-label">Taille</label>
          <div class="size-grid">
            <button
              type="button"
              class="size-btn"
              *ngFor="let t of tailles"
              [class.selected]="formData.taille === t.value"
              (click)="formData.taille = t.value"
            >
              {{ t.label }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="poids" class="form-label">Poids (kg)</label>
          <input
            id="poids"
            type="number"
            [(ngModel)]="formData.poids"
            name="poids"
            class="form-input"
            placeholder="60"
            min="0"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Ton de peau</label>
          <div class="skin-tone-grid">
            <button
              type="button"
              class="skin-tone-btn"
              *ngFor="let s of skinTones"
              [class.selected]="formData.skinTone === s.value"
              (click)="formData.skinTone = s.value"
              [title]="s.label"
            >
              <i [class]="s.icon" [style.color]="getSkintoneColor(s.value)"></i>
              <span>{{ s.label }}</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Morphologie</label>
          <div class="style-grid">
            <button
              type="button"
              class="style-btn"
              *ngFor="let m of morphologies"
              [class.selected]="formData.morphologie === m.value"
              (click)="formData.morphologie = m.value"
            >
              <i [class]="m.icon"></i>
              <span>{{ m.label }}</span>
            </button>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" type="button" (click)="prevStep()">
            <i class="fa-solid fa-arrow-left"></i> Retour
          </button>
          <button class="btn-submit" type="button" (click)="nextStep()">
            Continuer <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Step 3: Style -->
      <div class="form-step" *ngIf="currentStep === 3">
        <div class="form-group">
          <label class="form-label">Style préféré</label>
          <div class="style-grid">
            <button
              type="button"
              class="style-btn"
              *ngFor="let s of styleOptions"
              [class.selected]="formData.style === s.value"
              (click)="formData.style = s.value"
            >
              <i [class]="s.icon"></i>
              <span>{{ s.label }}</span>
            </button>
          </div>
        </div>

        <div class="style-hint">
          <i class="fa-solid fa-circle-info"></i>
          <span>Ces informations aideront les stylistes à mieux vous conseiller</span>
        </div>

        <div class="btn-row">
          <button class="btn-secondary" type="button" (click)="prevStep()">
            <i class="fa-solid fa-arrow-left"></i> Retour
          </button>
          <button class="btn-submit" type="submit" [disabled]="isLoading">
            <i class="fa-solid fa-check"></i>
            {{ isLoading ? "Création..." : "Créer mon profil" }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
