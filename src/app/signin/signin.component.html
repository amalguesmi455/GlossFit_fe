<main class="page auth-page">
  <section class="auth-card">
    <p class="eyebrow">Connexion</p>
    <h1>Sign in</h1>
    <p class="lead">Retrouve ton dressing, tes demandes et tes collaborations stylistes.</p>

    <form class="form" (ngSubmit)="signin()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required>
      </div>
      <button class="btn" type="submit">Se connecter</button>
    </form>

    @if (message) {
      <p class="status">{{ message }}</p>
    }

    <p class="muted auth-link">Pas encore de compte ? <a routerLink="/signup">Creer un compte</a></p>
  </section>
</main>
