<main class="page">
  <section class="shell grid two">
    <article class="panel profile-card">
      <p class="eyebrow">Profil styliste</p>
      <h1>{{ profile.name }}</h1>
      <p class="lead">{{ profile.bio }}</p>
      <div class="tag-row">
        <span class="tag">{{ profile.specialty }}</span>
        <span class="tag">{{ profile.city }}</span>
        <span class="tag">{{ profile.price }}</span>
        <span class="tag">{{ profile.availability }}</span>
      </div>
      <div class="actions profile-actions">
        <a class="btn" routerLink="/demand">Voir les demandes</a>
        <a class="btn-ghost" routerLink="/dressing">Consulter dressing</a>
      </div>
    </article>

    <article class="panel">
      <p class="eyebrow">CRUD profil</p>
      <h2>Modifier la fiche styliste</h2>
      <form class="form" (ngSubmit)="save()">
        <div class="field">
          <label for="name">Nom</label>
          <input id="name" name="name" [(ngModel)]="draft.name">
        </div>
        <div class="field">
          <label for="specialty">Specialite</label>
          <input id="specialty" name="specialty" [(ngModel)]="draft.specialty">
        </div>
        <div class="field">
          <label for="city">Ville</label>
          <input id="city" name="city" [(ngModel)]="draft.city">
        </div>
        <div class="grid two compact-grid">
          <div class="field">
            <label for="price">Tarif</label>
            <input id="price" name="price" [(ngModel)]="draft.price">
          </div>
          <div class="field">
            <label for="availability">Disponibilite</label>
            <input id="availability" name="availability" [(ngModel)]="draft.availability">
          </div>
        </div>
        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" [(ngModel)]="draft.bio"></textarea>
        </div>
        <div class="actions">
          <button class="btn" type="submit">Enregistrer</button>
          <button class="btn-ghost" type="button" (click)="reset()">Annuler</button>
        </div>
      </form>
      @if (saved) {
        <p class="saved">Fiche styliste mise a jour.</p>
      }
    </article>
  </section>
</main>
