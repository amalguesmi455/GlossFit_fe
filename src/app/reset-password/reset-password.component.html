<main class="auth-page reset-page">
  <header class="auth-topbar">
    <a class="brand-link" routerLink="/"><span>G</span>GlossFit</a>
  </header>

  <section class="auth-layout">
    <section class="auth-copy" aria-labelledby="reset-title">
      <span class="eyebrow"><i class="fa-solid fa-key"></i> Réinitialisation</span>
      <h1 id="reset-title">Nouveau mot de passe</h1>
      <p class="lead">Choisis un nouveau mot de passe pour retrouver l’accès à ton compte.</p>

      <form class="form" (ngSubmit)="resetPassword()" novalidate>
        <label class="field" for="newPassword">
          <span>Nouveau mot de passe</span>
          <input id="newPassword" name="newPassword" type="password" [(ngModel)]="newPassword" required minlength="6" autocomplete="new-password">
        </label>

        <label class="field" for="confirmPassword">
          <span>Confirmer le mot de passe</span>
          <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required minlength="6" autocomplete="new-password">
        </label>

        <button class="btn primary" type="submit" [disabled]="isLoading || !token">
          <i class="fa-solid fa-lock"></i>
          {{ isLoading ? 'Mise à jour...' : 'Modifier le mot de passe' }}
        </button>
      </form>

      <p class="status" *ngIf="message"><i class="fa-solid fa-circle-info"></i>{{ message }}</p>
      <p class="auth-link"><a routerLink="/signin">Retour à la connexion</a></p>
    </section>
  </section>
</main>
